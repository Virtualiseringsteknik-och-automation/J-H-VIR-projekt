---
#Dessa kommandon körs som vanliga tasks men enbart om de triggas av "notify". 

#Stoppar och startar om Apache2 helt (används när stora configfiler ändrats eller läggs till)
- name: restart apache
  service: 
    name: apache2
    state: restarted

# Laddar om konfigurationen utan avbrott (Används i produktion)
# (denna används inte i tasks just nu men är absolut nödvändig i en produktionsmiljö)
- name: reload apache
  service: 
    name: apache2
    state: reload


#Tasks i denna fil körs alltid sist.