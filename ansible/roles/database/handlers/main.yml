---
#Dessa kommandon körs som vanliga tasks men enbart om de triggas av "notify". 

#Stoppar och startar om postgresql helt (Kortare avbrott)
- name: restart postgresql
  service:
    name: postgresql
    state: restarted

#Laddar om konfigurationen utan avbrott (Används i produktion)
- name: reload postgresql
  service:
    name: postgresql
    state: reloaded


#Tasks i denna fil körs alltid sist.